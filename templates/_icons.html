{# Inline SVG icons. Offline-friendly, no icon font required. #}
{% macro icon(name, size=20) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'spark' -%}
    <path d="M12 3l1.9 5.6L19.5 10l-5.6 1.4L12 17l-1.9-5.6L4.5 10l5.6-1.4z"/>
  {%- elif name == 'terminal' -%}
    <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/>
  {%- elif name == 'palette' -%}
    <path d="M12 3a9 9 0 100 18h1.5a2.5 2.5 0 000-5H12a2 2 0 010-4h3a5 5 0 000-10z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="9.5" cy="6.5" r="1"/>
  {%- elif name == 'fact_check' -%}
    <rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10l2 2 4-4M8 16h8"/>
  {%- elif name == 'arrow-right' -%}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == 'arrow-up-right' -%}
    <path d="M7 17L17 7M9 7h8v8"/>
  {%- elif name == 'menu' -%}
    <path d="M4 7h16M4 12h16M4 17h16"/>
  {%- elif name == 'dashboard' -%}
    <rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>
  {%- elif name == 'article' -%}
    <path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h4"/>
  {%- elif name == 'group' -%}
    <circle cx="9" cy="9" r="3"/><path d="M3 20a6 6 0 0112 0M16 7a3 3 0 010 6M18 20a6 6 0 00-3-5"/>
  {%- elif name == 'settings' -%}
    <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
  {%- elif name == 'plus' -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == 'edit' -%}
    <path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>
  {%- elif name == 'trash' -%}
    <path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/>
  {%- elif name == 'check' -%}
    <path d="M5 13l4 4L19 7"/>
  {%- elif name == 'x' -%}
    <path d="M6 6l12 12M18 6L6 18"/>
  {%- elif name == 'github' -%}
    <path d="M9 19c-4 1.5-4-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 00-1.3-3.2 4.2 4.2 0 00-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 00-6.2 0C6.5 2.7 5.4 3 5.4 3a4.2 4.2 0 00-.1 3.2A4.6 4.6 0 004 9.4c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>
  {%- elif name == 'heart' -%}
    <path d="M12 20s-7-4.4-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.6-7 9-7 9z"/>
  {%- elif name == 'chart' -%}
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
  {%- elif name == 'shield' -%}
    <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>
  {%- elif name == 'bolt' -%}
    <path d="M13 2L4 14h7l-1 8 9-12h-7z"/>
  {%- elif name == 'book' -%}
    <path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19a2 2 0 012-2h13"/>
  {%- elif name == 'download' -%}
    <path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>
  {%- elif name == 'globe' -%}
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
  {%- elif name == 'calendar' -%}
    <rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == 'mail' -%}
    <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/>
  {%- else -%}
    <circle cx="12" cy="12" r="9"/>
  {%- endif -%}
</svg>
{%- endmacro %}
